# Compile-only configuration for checking the component locally:
#   .venv/bin/esphome compile tests/esphome/jura-test.yaml
esphome:
  name: jura-test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: compile-only
  password: compile-only

api:
  actions:
    - action: set_status_polling_paused
      variables:
        paused: bool
      then:
        - lambda: id(jura).set_status_polling_paused(paused);

external_components:
  - source:
      type: local
      path: ../../components
    components: [jura_f50]

uart:
  id: jura_uart
  tx_pin: GPIO26
  rx_pin: GPIO27
  baud_rate: 9600

jura_f50:
  id: jura

switch:
  - platform: template
    id: status_polling_paused
    name: Status polling paused
    lambda: return id(jura).is_status_polling_paused();
    turn_on_action:
      - lambda: id(jura).set_status_polling_paused(true);
    turn_off_action:
      - lambda: id(jura).set_status_polling_paused(false);
  - platform: template
    id: coffee_power
    name: Power
    turn_on_action:
      - lambda: id(jura).queue_command("AN:01");
    turn_off_action:
      - lambda: id(jura).queue_command("AN:02");

binary_sensor:
  - platform: jura_f50
    power:
      name: Power state
      on_state:
        - lambda: id(coffee_power).publish_state(x);

sensor:
  - platform: jura_f50
    single_coffee:
      name: Single coffee counter
    total_coffee:
      name: Total coffee counter
    update_interval: 120s
